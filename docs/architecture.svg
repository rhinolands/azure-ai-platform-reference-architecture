<svg viewBox="0 0 720 596" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif" role="img" aria-label="Azure AI-platform reference architecture: App Gateway/WAF and Entra ID at the edge feed Azure API Management (the single model gateway: authz, version-pin, rate-limit, prompt-injection defense, audit) with Llama Guard I/O safety; the gateway governs an MCP agent orchestrator on AKS GPU nodes that drives specialized sub-agents and self-hosted vLLM serving, with RAG vector search and Postgres/Redis state; secrets come from Key Vault by managed identity and telemetry flows to Azure Monitor and SIEM.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5A5142" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A8362B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="596" fill="#F4EFE3"/>
  <text x="24" y="34" font-size="21" font-weight="700" fill="#1B1916">Azure AI-Platform Reference Architecture</text>
  <text x="24" y="54" font-size="12.5" fill="#6B6151">self-hosted LLMs &#183; governed agent gateway &#183; Zero-Trust &#183; everything as code</text>

  <text x="24" y="84" font-size="11" font-weight="700" fill="#A8362B" letter-spacing="0.5">EDGE</text>
  <rect x="70" y="92" width="214" height="50" rx="8" fill="#E7DCC6" stroke="#D6C9AA"/>
  <text x="177" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#1B1916">App Gateway + WAF v2</text>
  <text x="177" y="132" text-anchor="middle" font-size="11" fill="#6B6151">public entry, filtered</text>
  <rect x="320" y="92" width="310" height="50" rx="8" fill="#E7DCC6" stroke="#D6C9AA"/>
  <text x="475" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#1B1916">Entra ID &#183; Conditional Access &#183; PIM</text>
  <text x="475" y="132" text-anchor="middle" font-size="11" fill="#6B6151">least-privilege, JIT &#8212; humans + agents</text>

  <text x="24" y="176" font-size="11" font-weight="700" fill="#A8362B" letter-spacing="0.5">GATEWAY</text>
  <rect x="70" y="166" width="372" height="104" rx="10" fill="#1B1916"/>
  <text x="256" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#F4EFE3">AZURE API MANAGEMENT</text>
  <text x="256" y="209" text-anchor="middle" font-size="11" fill="#C9BCA0">the single model gateway &#8212; one choke point</text>
  <line x1="90" y1="221" x2="422" y2="221" stroke="#4A443B" stroke-width="1"/>
  <text x="90" y="241" font-size="12" fill="#EDE6D8">&#8226; authz &#183; version-pin &#183; rate-limit</text>
  <text x="90" y="260" font-size="12" fill="#F2B2A8">&#8226; prompt-injection defense &#183; audit</text>
  <rect x="462" y="180" width="186" height="76" rx="8" fill="#E7DCC6" stroke="#D6C9AA"/>
  <text x="555" y="206" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1B1916">I/O Safety</text>
  <text x="555" y="224" text-anchor="middle" font-size="11.5" fill="#6B6151">Llama Guard</text>
  <text x="555" y="242" text-anchor="middle" font-size="11.5" fill="#6B6151">streaming-safe I/O</text>

  <text x="24" y="312" font-size="11" font-weight="700" fill="#A8362B" letter-spacing="0.5">AKS</text>
  <rect x="60" y="296" width="600" height="98" rx="10" fill="none" stroke="#D6C9AA" stroke-dasharray="4 4"/>
  <text x="74" y="314" font-size="11" fill="#6B6151">AKS &#183; GPU node pools</text>
  <rect x="78" y="322" width="206" height="60" rx="8" fill="#E7DCC6" stroke="#D6C9AA"/>
  <text x="181" y="347" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1B1916">Agent Orchestrator (MCP)</text>
  <text x="181" y="365" text-anchor="middle" font-size="11" fill="#6B6151">per-agent least privilege</text>
  <rect x="304" y="322" width="150" height="60" rx="8" fill="#E7DCC6" stroke="#D6C9AA"/>
  <text x="379" y="347" text-anchor="middle" font-size="13" font-weight="600" fill="#1B1916">Specialized</text>
  <text x="379" y="364" text-anchor="middle" font-size="13" font-weight="600" fill="#1B1916">sub-agents</text>
  <rect x="474" y="322" width="170" height="60" rx="8" fill="#E7DCC6" stroke="#D6C9AA"/>
  <text x="559" y="347" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1B1916">Self-hosted LLM &#183; vLLM</text>
  <text x="559" y="365" text-anchor="middle" font-size="11" fill="#6B6151">open-weight, in-tenant</text>

  <text x="24" y="436" font-size="11" font-weight="700" fill="#A8362B" letter-spacing="0.5">DATA</text>
  <rect x="78" y="420" width="206" height="52" rx="8" fill="#E7DCC6" stroke="#D6C9AA"/>
  <text x="181" y="451" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1B1916">Vector search (RAG)</text>
  <rect x="304" y="420" width="150" height="52" rx="8" fill="#E7DCC6" stroke="#D6C9AA"/>
  <text x="379" y="451" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1B1916">Postgres / Redis</text>

  <text x="24" y="512" font-size="11" font-weight="700" fill="#A8362B" letter-spacing="0.5">OPS</text>
  <rect x="78" y="496" width="266" height="52" rx="8" fill="#E7DCC6" stroke="#D6C9AA"/>
  <text x="211" y="527" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1B1916">Azure Monitor &#8594; SIEM</text>
  <rect x="474" y="496" width="170" height="52" rx="8" fill="#E7DCC6" stroke="#D6C9AA"/>
  <text x="559" y="527" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1B1916">Key Vault</text>

  <line x1="177" y1="142" x2="177" y2="166" stroke="#5A5142" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M430,142 C420,152 415,158 412,166" fill="none" stroke="#A8362B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowR)"/>
  <text x="446" y="158" font-size="10.5" fill="#A8362B">identity</text>
  <line x1="442" y1="218" x2="462" y2="218" stroke="#5A5142" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="181" y1="270" x2="181" y2="322" stroke="#5A5142" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="189" y="290" font-size="10.5" font-weight="700" fill="#A8362B">governed calls</text>
  <line x1="284" y1="352" x2="304" y2="352" stroke="#5A5142" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="454" y1="352" x2="474" y2="352" stroke="#5A5142" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="382" x2="150" y2="420" stroke="#5A5142" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M230,382 C250,400 300,406 340,420" fill="none" stroke="#5A5142" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M200,394 C195,440 200,470 205,496" fill="none" stroke="#5A5142" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="120" y="486" font-size="10.5" fill="#6B6151">telemetry</text>
  <path d="M559,496 C559,450 559,420 559,394" fill="none" stroke="#A8362B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowR)"/>
  <text x="566" y="446" font-size="10.5" fill="#A8362B">secrets (MI)</text>

  <line x1="40" y1="566" x2="680" y2="566" stroke="#DDD2BC" stroke-width="1"/>
  <text x="360" y="586" text-anchor="middle" font-size="11.5" font-weight="600" fill="#A8362B">Every model call through the gateway &#183; per-agent least privilege &#183; confirm + audit on writes &#183; I/O guardrails.</text>
</svg>
